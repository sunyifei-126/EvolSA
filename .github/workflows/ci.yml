name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pip==25.2 setuptools==80.9.0
      - run: python -m pip install --no-build-isolation -e .
      - run: python scripts/check_release.py
      - run: python -m unittest discover -s tests -v
      - run: evolsa demo --output .evolsa/ci-demo
      - run: evolsa replay .evolsa/ci-demo
