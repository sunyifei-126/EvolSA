name: operator-lab

on:
  pull_request:
    paths:
      - "operators/community/**"
      - "benchmarks/**"
      - "src/evolsa/lab/**"
      - "src/evolsa/registry/**"

permissions:
  contents: read

jobs:
  evidence-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install pip==25.2 setuptools==80.9.0
      - run: python -m pip install --no-build-isolation -e .
      - run: python -m unittest tests.test_foundry_lab_registry -v
      - run: python scripts/check_release.py
