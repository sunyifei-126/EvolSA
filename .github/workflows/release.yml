name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged commit to belong to main
        run: git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install pinned build and test tooling
        run: python -m pip install pip==25.2 setuptools==80.9.0 build==1.3.0
      - name: Install source tree for src-layout tests
        run: python -m pip install --no-build-isolation -e .
      - run: python scripts/check_release.py
      - run: python -m unittest discover -s tests -v
      - name: Build wheel and source distribution
        run: python -m build --no-isolation
      - name: Smoke-test the built wheel in a clean environment
        run: |
          python -m venv /tmp/evolsa-release-smoke
          /tmp/evolsa-release-smoke/bin/python -m pip install dist/*.whl
          /tmp/evolsa-release-smoke/bin/evolsa --version
          /tmp/evolsa-release-smoke/bin/evolsa demo --output /tmp/evolsa-release-demo
          /tmp/evolsa-release-smoke/bin/evolsa replay /tmp/evolsa-release-demo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-release-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build-and-verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-release-distributions
          path: dist
      - uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
