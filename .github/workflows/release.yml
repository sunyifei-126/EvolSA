name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged commit to belong to main
        run: git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned build and test tooling
        run: python -m pip install pip==25.2 setuptools==80.9.0 build==1.3.0
      - name: Install source tree for src-layout tests
        run: python -m pip install --no-build-isolation -e .
      - run: python scripts/check_release.py
      - run: python -m unittest discover -s tests -v
      - name: Build wheel and source distribution
        run: python -m build --no-isolation
      - name: Smoke-test the built wheel in a clean environment
        run: |
          python -m venv /tmp/evolsa-release-smoke
          /tmp/evolsa-release-smoke/bin/python -m pip install dist/*.whl
          /tmp/evolsa-release-smoke/bin/evolsa --version
          /tmp/evolsa-release-smoke/bin/evolsa demo --output /tmp/evolsa-release-demo
          /tmp/evolsa-release-smoke/bin/evolsa replay /tmp/evolsa-release-demo
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-release-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build-and-verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: verified-release-distributions
          path: dist
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
